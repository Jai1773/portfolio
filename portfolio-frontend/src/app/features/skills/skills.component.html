<section class="skills scroll-reveal" scrollReveal id="skills">
  <div class="container">
    <h2 class="section-title">My Skills</h2>
    <div class="skills-grid">
      <div class="skill-category" *ngFor="let group of skills">
        <h3>{{ group.category }}</h3>
        <div class="skill-list">
          <app-skill-badge *ngFor="let skill of group.items" [name]="skill"></app-skill-badge>
        </div>
      </div>
    </div>
  </div>
</section>
